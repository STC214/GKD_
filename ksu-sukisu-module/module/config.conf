# Module install and keep-alive settings.
# Edit /data/adb/modules/gkd_ksu_sukisu/config.conf after flashing.

# Bundled app package ID is fixed to li.songe.gkd.
GKD_PACKAGE=li.songe.gkd
# Fixed owner profile. Runtime ignores other values to prevent a second matching engine.
GKD_USER_ID=0
# When XSpace 999 already exists at install time, register the same APK there
# for LSPosed only. No second GKD process, root grant or accessibility is started.
# LSPosed enabling/scope selection remains manual. Set 0 to opt out.
GKD_REGISTER_XSPACE_MODULE=1
# Removing this module retains the APK, app data and XSpace registration.
# Package-missing sleep and running-process watchdog interval in seconds;
# valid range: 60..86400.
GKD_KEEP_ALIVE_INTERVAL=300
# Reapply background AppOps and the battery whitelist; valid range:
# 300..604800 seconds.
GKD_POLICY_REFRESH_INTERVAL=1800
# Rotate service.log after it exceeds this size in bytes; valid range:
# 4096..10485760. Invalid values fall back to 262144.
GKD_LOG_MAX_BYTES=262144
